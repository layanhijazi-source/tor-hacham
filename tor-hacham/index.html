<meta charset="utf-8">
<title>תור חכם</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: sticky top bar, role switch (client chat / owner console), floating demo drawer. Palette: cream ground, sandy beige surfaces, smoky rose accents, deep burgundy actions. */
:root{
  --cream:#F8F1E7; --beige:#EDE0CD; --beige-2:#E2D0B6; --rose:#C79A98; --rose-soft:#F0DAD5;
  --burg:#5C1B2D; --burg-d:#3F0F1D; --ink:#2B1B1E; --muted:#74595E; --line:#DCC9B1; --white:#FFFBF5;
  --font-d:'Frank Ruhl Libre','David Libre',serif; --font-b:'Rubik','Segoe UI',system-ui,sans-serif;
  --r:18px; --shadow:0 10px 30px -14px rgba(63,15,29,.35);
}
*{box-sizing:border-box}
html{color-scheme:light}
body{background:var(--cream);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.55;direction:rtl;
  padding-block:0 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-d);color:var(--burg);margin:0;text-wrap:balance;line-height:1.2}
.wrap{max-width:1180px;margin:0 auto}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;padding:18px 0 10px}
.brand{display:flex;align-items:center;gap:12px;margin-inline-end:auto}
.mark{width:44px;height:44px;border-radius:50%;background:var(--burg);display:grid;place-items:center}
.brand b{font-family:var(--font-d);font-size:26px;color:var(--burg);font-weight:900;display:block;line-height:1}
.brand small{color:var(--muted);font-size:12.5px}
.seg{display:flex;background:var(--beige);border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;padding:8px 18px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:500;transition:.25s}
.seg button[aria-pressed=true]{background:var(--burg);color:var(--cream)}
.banner{background:var(--rose-soft);border:1px dashed var(--rose);color:var(--burg-d);border-radius:12px;padding:8px 14px;font-size:13px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.banner b{font-weight:600}
.clock{font-variant-numeric:tabular-nums;color:var(--burg);font-weight:500}

/* generic */
.card{background:var(--beige);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.card.plain{background:var(--white);box-shadow:none;border:1px solid var(--line)}
.btn{border:0;border-radius:999px;padding:10px 20px;cursor:pointer;font-weight:500;transition:transform .15s,background .2s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--burg);color:var(--cream)}.btn.pri:hover{background:var(--burg-d)}
.btn.sec{background:var(--rose-soft);color:var(--burg-d)}.btn.sec:hover{background:#E9C9C3}
.btn.ghost{background:transparent;border:1px solid var(--burg);color:var(--burg)}
.btn.sm{padding:6px 14px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 11px;font-size:12px;font-weight:500;background:var(--beige-2);color:var(--burg-d)}
.chip.ok{background:var(--burg);color:var(--cream)}.chip.rose{background:var(--rose);color:var(--burg-d)}.chip.soft{background:var(--rose-soft)}
.muted{color:var(--muted)}
.grid{display:grid;gap:20px}
.pill-row{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1px solid var(--line);background:var(--white);border-radius:999px;padding:7px 14px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.pill[aria-pressed=true]{background:var(--burg);color:var(--cream);border-color:var(--burg)}
.badge{background:var(--rose);color:var(--burg-d);border-radius:999px;min-width:20px;height:20px;display:inline-grid;place-items:center;font-size:12px;font-weight:600;padding:0 5px}

/* customer view */
.cust{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);margin-top:18px;align-items:start}
.phone{background:var(--white);border-radius:26px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line);display:flex;flex-direction:column;height:min(720px,80vh);min-height:520px}
.phone-h{background:var(--burg);color:var(--cream);padding:14px 18px;display:flex;align-items:center;gap:12px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--rose);display:grid;place-items:center;font-family:var(--font-d);font-weight:700;color:var(--burg-d)}
.phone-h small{opacity:.8;display:block;font-size:12px}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:
  radial-gradient(circle at 20% 10%,rgba(199,154,152,.12),transparent 40%),var(--cream)}
.m{max-width:86%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;word-break:break-word}
.m.bot{background:var(--white);border:1px solid var(--line);align-self:flex-end;border-end-end-radius:4px}
.m.me{background:var(--rose-soft);align-self:flex-start;border-end-start-radius:4px}
.m.owner{background:var(--burg);color:var(--cream);align-self:flex-end}
.m small{display:block;opacity:.6;font-size:11px;margin-top:4px}
.m .who{font-size:11.5px;font-weight:600;color:var(--burg);display:block;margin-bottom:2px}
.m.owner .who{color:var(--rose-soft)}
.sys{align-self:center;background:var(--beige);color:var(--muted);font-size:12px;padding:4px 12px;border-radius:999px;max-width:92%;text-align:center}
.pop{animation:pop .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.opt{border:1px solid var(--burg);background:transparent;color:var(--burg);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:13.5px;transition:.2s}
.opt:hover:not([disabled]){background:var(--burg);color:var(--cream)}
.opt[disabled]{opacity:.4;cursor:default;border-color:var(--line);color:var(--muted)}
.cd{margin-top:8px;font-size:13px;color:var(--burg);background:var(--rose-soft);border-radius:10px;padding:4px 10px;display:inline-block}
.cd b{font-variant-numeric:tabular-nums}
/* hourglass shown to the customer while a freed slot is held for her */
.hg{display:inline-block;margin-inline-end:4px;animation:hgflip 2s ease-in-out infinite}
@keyframes hgflip{0%,70%{transform:rotate(0)}85%,100%{transform:rotate(180deg)}}
@media (prefers-reduced-motion:reduce){.hg{animation:none}}
.quick{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:var(--beige);scrollbar-width:none}
.quick .opt{white-space:nowrap;background:var(--white)}
.composer{display:flex;gap:8px;padding:10px 12px;background:var(--beige)}
.composer input{flex:1;min-width:0;border:1px solid var(--line);background:var(--white);border-radius:999px;padding:10px 16px}
.side h3{font-size:20px;margin-bottom:10px}
.li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border:0}
.note{font-size:12.5px;color:var(--muted)}

/* admin */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0}
.tabs button{border:0;background:var(--beige);color:var(--burg-d);padding:9px 18px;border-radius:999px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;font-weight:500}
.tabs button[aria-pressed=true]{background:var(--burg);color:var(--cream)}
.two{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);align-items:start}
.dayhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.dayhead h2{font-size:28px;margin-inline-end:auto}
.slot{display:grid;grid-template-columns:70px 1fr auto;gap:14px;align-items:center;background:var(--white);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;transition:.3s}
.slot.hold{border-color:var(--rose);background:var(--rose-soft)}
.slot.block{background:var(--beige-2);border-color:transparent}
.slot.flash{animation:flash 1.6s}
@keyframes flash{0%{background:var(--rose)}100%{background:var(--white)}}
.t{font-family:var(--font-d);font-size:24px;font-weight:700;color:var(--burg);line-height:1;font-variant-numeric:tabular-nums}
.t small{display:block;font-family:var(--font-b);font-size:12px;color:var(--muted);font-weight:400;margin-top:4px}
.gap{border:1.5px dashed var(--line);border-radius:14px;padding:8px 16px;margin-bottom:10px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:16px}
.kpi b{font-family:var(--font-d);font-size:34px;color:var(--burg);display:block;line-height:1.1}
.kpi span{font-size:13px;color:var(--muted)}
.bars{display:flex;gap:10px;align-items:flex-end;height:150px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%;font-size:12px;color:var(--muted)}
.bar i{display:block;width:100%;max-width:46px;background:var(--rose);border-radius:10px 10px 4px 4px;min-height:3px;transition:height .6s}
.bar.today i{background:var(--burg)}
table{width:100%;border-collapse:collapse}
th,td{text-align:start;padding:10px 8px;border-bottom:1px solid var(--line);font-size:14px}
th{color:var(--muted);font-weight:500;font-size:12.5px}
.tblwrap{overflow-x:auto}
.ho{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.ho .ctx{background:var(--cream);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:13.5px}
.ho textarea,.form input,.form select{width:100%;border:1px solid var(--line);background:var(--cream);border-radius:12px;padding:9px 12px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end}
.form label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:3px}
.hrs{display:grid;grid-template-columns:90px 1fr;gap:6px 12px;align-items:center}
.hrs .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hrs input[type=time]{width:auto;padding:5px 8px}
.soon{opacity:.75}

/* demo drawer */
.dock{position:fixed;inset-inline-start:max(16px,env(safe-area-inset-left,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:20;display:flex;flex-direction:column;gap:10px;align-items:flex-start;max-width:min(420px,calc(100vw - 32px))}
.dock .panel{background:var(--burg-d);color:var(--cream);border-radius:20px;padding:18px;box-shadow:0 20px 50px -10px rgba(0,0,0,.45);width:100%}
.dock h3{color:var(--rose-soft);font-size:20px}
.step{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.12);font-size:14px}
.step .n{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:12px}
.step.done .n{background:var(--rose);color:var(--burg-d)}
.step.done{opacity:.65}
.step .btn{background:var(--rose);color:var(--burg-d)}
.dock .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.dock .row .btn{background:rgba(255,255,255,.12);color:var(--cream)}
.fab{background:var(--burg);color:var(--cream);border:0;border-radius:999px;padding:12px 20px;font-weight:500;cursor:pointer;box-shadow:var(--shadow)}
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--burg-d);color:var(--cream);padding:10px 18px;border-radius:999px;box-shadow:var(--shadow);animation:pop .3s;font-size:14px}

/* about */
.hero{position:relative;border-radius:26px;overflow:hidden;margin-top:18px;min-height:300px;display:flex;align-items:flex-end;background:var(--beige-2)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .cap{position:relative;width:100%;padding:70px 28px 24px;background:linear-gradient(to top,rgba(63,15,29,.88),rgba(63,15,29,0));color:var(--cream)}
.hero h1{color:var(--cream);font-size:clamp(30px,5vw,48px);font-weight:900}
.hero p{margin:6px 0 0;max-width:56ch;color:#F0DAD5}
.about{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);margin-top:20px;align-items:start}
.tl{list-style:none;margin:12px 0 0;padding:0;position:relative}
.tl::before{content:"";position:absolute;inset-block:6px;inset-inline-start:6px;width:2px;background:var(--rose)}
.tl li{position:relative;padding-inline-start:30px;margin-bottom:18px}
.tl li::before{content:"";position:absolute;inset-inline-start:0;top:6px;width:14px;height:14px;border-radius:50%;background:var(--burg);border:3px solid var(--beige)}
.tl li.next::before{background:var(--beige);border-color:var(--rose)}
.tl b{display:block;font-family:var(--font-d);font-size:18px;color:var(--burg)}
.svcs{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-top:20px}
.svc{background:var(--white);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.svc .ph{aspect-ratio:4/3;background:var(--beige);display:grid;place-items:center;text-align:center;padding:14px;color:var(--muted);font-size:13px;border-bottom:1px solid var(--line)}
.svc img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.art{position:relative;aspect-ratio:4/3;background:var(--beige-2)}
.art svg{width:100%;height:100%;display:block}
.art img.pt{object-position:50% 42%}
.art .tag{position:absolute;inset-inline-start:10px;bottom:10px;background:rgba(255,251,245,.9);color:var(--burg-d);font-size:11.5px;padding:2px 10px;border-radius:999px}
.svc .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px}
.svc h3{font-size:22px}
.sample{border:1.5px dashed var(--rose);background:var(--rose-soft);border-radius:14px;padding:10px 14px;font-size:13px;color:var(--burg-d)}
@media (max-width:860px){.about{grid-template-columns:1fr}}
@media (max-width:860px){
  .cust,.two{grid-template-columns:1fr}
  .slot{grid-template-columns:60px 1fr}
  .slot>:last-child{grid-column:1/-1}
  .phone{height:75vh}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app"></div>
<div id="toasts" aria-live="polite"></div>

<script>
(function(){
'use strict';
/* ---------- config & i18n stub (he only for now; add 'ar'/'en' dictionaries + dir here) ---------- */
const I18N={he:{dir:'rtl',brand:'תור חכם',tagline:'ניהול תורים ושירות לקוחות',chat:'שיחת לקוחה',admin:'ניהול המכון'}};
const LANG='he';
const KEY='tor-hacham-proto-v1';
const MIN=60000, BUF=10, HOLD=30;
/* services and staff are data, so more of either can be added without touching the logic */
const SERVICES=[
  {id:'facial',name:'טיפול פנים',dur:60,price:250},
  {id:'mani',name:'מניקור',dur:45,price:100},
  {id:'brows',name:'עיצוב גבות',dur:20,price:60}];
const STAFF=[{id:'owner',name:'בעלת המכון'}];
const DEFAULT_HOURS={0:[540,1140],1:[540,1140],2:[540,1140],3:[540,1140],4:[540,1140],5:[540,780],6:null};
const DAYS=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const CUSTOMERS=[
  {id:'c1',name:'שירה כהן',phone:'050-555-0101'},
  {id:'c2',name:'דנה מזרחי',phone:'050-555-0102'},
  {id:'c3',name:'רונית לוי',phone:'050-555-0103'},
  {id:'c4',name:'מאיה דהן',phone:'050-555-0104'},
  {id:'c5',name:"נועה אברמוביץ'",phone:'050-555-0105'}];

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const fmt=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const parseT=s=>{const p=s.split(':');return +p[0]*60+ +p[1]};
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dof=k=>{const p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2])};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const svc=id=>SERVICES.find(s=>s.id===id);
const cust=id=>CUSTOMERS.find(c=>c.id===id);
const first=n=>n.split(' ')[0];
const cd=ms=>{ms=Math.max(0,ms);const s=Math.floor(ms/1000);return pad(Math.floor(s/60))+':'+pad(s%60)};

/* ---------- state ---------- */
let S=load()||seed();
let ui={confirm:null,flash:null,animFrom:0};
function load(){try{const r=localStorage.getItem(KEY);if(r){const x=JSON.parse(r);if(x&&x.v===2)return x}}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function vnow(){return S.clock+(Date.now()-S.sync)}
function setClock(ms){S.clock=ms;S.sync=Date.now()}
function nowKey(){return dkey(new Date(vnow()))}
function nowMin(){const d=new Date(vnow());return d.getHours()*60+d.getMinutes()}
function startMs(k,m){return dof(k).getTime()+m*MIN}
function uid(p){return p+(++S.seq)}
function dayLabel(k){const t=nowKey();const d=dof(k);const base='יום '+DAYS[d.getDay()]+' '+d.getDate()+'.'+(d.getMonth()+1);
  if(k===t)return 'היום, '+base;const tm=new Date(dof(t));tm.setDate(tm.getDate()+1);if(k===dkey(tm))return 'מחר, '+base;return base}
function bDay(k){const l=dayLabel(k);return /^(היום|מחר)/.test(l)?l:'ב'+l}
function clockLabel(){const d=new Date(vnow());return 'יום '+DAYS[d.getDay()]+' '+d.getDate()+'.'+(d.getMonth()+1)+' · '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())}

function seed(){
  const d=new Date();d.setHours(9,0,0,0);
  while(d.getDay()>3)d.setDate(d.getDate()+1);           /* start on Sun-Wed so seeded days fit opening hours */
  const D0=dkey(d);const n=new Date(d);n.setDate(n.getDate()+1);const D1=dkey(n);
  const s={v:2,clock:d.getTime(),sync:Date.now(),hours:JSON.parse(JSON.stringify(DEFAULT_HOURS)),seq:100,
    bookings:[],blocks:[],waitlist:[],offers:[],handovers:[],chats:{},log:[],queue:[],failNext:false,cur:'c1',mode:'customer',tab:'day',adminDay:D0,demo:0,demoOpen:false};
  const B=(id,c,sv,date,start,extra)=>s.bookings.push(Object.assign({id,custId:c,svc:sv,date,start,status:'confirmed',source:'chat'},extra||{}));
  B('b1','c2','facial',D0,630,{demo:true});                /* 10:30, so a second offer after a 31 minute expiry still has 30+ minutes */
  B('b2','c5','brows',D0,570);
  B('b3','c4','mani',D0,720);
  B('b4','c4','facial',D0,930);
  B('b5','c1','mani',D1,660);
  B('b6','c2','brows',D1,540);
  B('b7','c3','facial',D1,780);
  s.blocks.push({id:'x1',date:D0,start:780,end:840,reason:'הפסקת צהריים'});
  const W=(id,c,date,ago)=>s.waitlist.push({id,custId:c,svc:'facial',date,from:null,to:null,joined:d.getTime()-ago*MIN,status:'waiting',consent:true,skip:[]});
  W('w1','c3',D0,180);W('w2','c1',D0,120);W('w3','c5',null,60);
  CUSTOMERS.forEach(c=>{s.chats[c.id]=introMsgs(c,()=>++s.seq,'09:00')});
  return s;
}
/* opening of every chat: says it is an automated agent in a simulation, what is stored and why, and how to delete it */
function introMsgs(c,next,t){return[
  {id:next(),from:'sys',text:'שיחה מדומה בסביבת הדגמה. אין חיבור אמיתי ל-WhatsApp, וכל הנתונים פיקטיביים.'},
  {id:next(),from:'bot',text:'שלום '+first(c.name)+', כאן הסוכנת של תור חכם 🌸\nאני סוכנת אוטומטית, לא אדם. אפשר לברר מידע, לקבוע או לבטל תור ולהצטרף לרשימת המתנה. שאלות רפואיות, החזרים ותלונות אעביר לבעלת המכון.\n\nמה נשמר: שם, טלפון, התורים, רשימת ההמתנה ותוכן השיחה, רק לצורך ניהול התורים. אפשר לבקש מחיקה בכל עת דרך "פרטיות ומחיקה".\n\nבמה לעזור?',btns:menuBtns(),used:false,t}]}
function menuBtns(){return[{l:'קביעת תור',a:'book'},{l:'שירותים ומחירים',a:'info'},{l:'התורים שלי',a:'mine'},{l:'ביטול תור',a:'cancel'},{l:'רשימת המתנה',a:'wl'},{l:'שיחה עם בעלת המכון',a:'human'},{l:'פרטיות ומחיקה',a:'priv'}]}
const TR=[['בוקר',540,720],['צהריים',720,900],['אחר הצהריים',900,1140]];
function wlDesc(w){return svc(w.svc).name+(w.date?' · '+dayLabel(w.date).replace(/^(היום|מחר), /,''):' · כל יום')+(w.from!=null?' · '+fmt(w.from)+'–'+fmt(w.to):'')}
function inHours(){const h=S.hours[new Date(vnow()).getDay()];const m=nowMin();return !!h&&m>=h[0]&&m<h[1]}
/* demo of a failed save: when armed from presentation mode, the next saving action fails and nothing is confirmed */
function commit(){if(S.failNext){S.failNext=false;logEv('כשל מדומה בשמירה: הפעולה לא נשמרה ולא נשלח אישור');return false}return true}
function logEv(t){S.log.unshift({t:vnow(),text:t});S.log.length=Math.min(S.log.length,40)}

/* ---------- scheduling engine ---------- */
function busy(date,ign){
  const r=[];
  S.bookings.forEach(b=>{if(b.status==='confirmed'&&b.date===date)r.push({s:b.start,e:b.start+svc(b.svc).dur+BUF,k:'b',ref:b})});
  S.blocks.forEach(b=>{if(b.date===date)r.push({s:b.start,e:b.end,k:'x',ref:b})});
  S.offers.forEach(o=>{if(o.status==='pending'&&o.date===date&&o.id!==ign)r.push({s:o.start,e:o.start+svc(o.svc).dur+BUF,k:'o',ref:o})});
  return r.sort((a,b)=>a.s-b.s);
}
function isFree(date,start,sid,ign){
  const h=S.hours[dof(date).getDay()];if(!h)return false;
  const d=svc(sid).dur;
  if(start<h[0]||start+d>h[1])return false;
  if(startMs(date,start)<=vnow())return false;
  const e=start+d+BUF;
  return !busy(date,ign).some(x=>start<x.e&&e>x.s);
}
function custConflict(cid,date,start,sid){
  const e=start+svc(sid).dur+BUF;
  return S.bookings.some(b=>b.custId===cid&&b.status==='confirmed'&&b.date===date&&start<b.start+svc(b.svc).dur+BUF&&e>b.start);
}
function freeSlots(date,sid){
  const h=S.hours[dof(date).getDay()];if(!h)return[];
  const r=[];for(let m=h[0];m+svc(sid).dur<=h[1];m+=30){if(isFree(date,m,sid)&&!custConflict(S.cur,date,m,sid))r.push(m)}return r;
}
function openDays(n){
  const r=[];const d=dof(nowKey());
  for(let i=0;i<21&&r.length<n;i++){if(S.hours[d.getDay()])r.push(dkey(d));d.setDate(d.getDate()+1)}
  return r;
}
function say(cid,from,text,btns,oid){
  const m={id:++S.seq,from,text,btns:btns||null,used:false,t:fmt(nowMin())};
  if(oid)m.oid=oid;(S.chats[cid]=S.chats[cid]||[]).push(m);return m;
}
function addBooking(cid,sid,date,start,source){
  const b={id:uid('b'),custId:cid,svc:sid,date,start,status:'confirmed',source:source||'chat'};
  S.bookings.push(b);ui.flash=b.id;return b;
}
function cancelBooking(bid,by){
  const b=S.bookings.find(x=>x.id===bid);
  if(!b||b.status!=='confirmed')return false;
  if(by!=='owner'&&b.custId!==by)return false;       /* a client can only touch her own booking */
  if(by!=='owner'&&startMs(b.date,b.start)<=vnow())return false;   /* after the start a person decides */
  b.status='cancelled';b.cancelledAt=vnow();
  logEv(cust(b.custId).name+': '+svc(b.svc).name+' '+dayLabel(b.date)+' '+fmt(b.start)+' בוטל'+(by==='owner'?' בידי בעלת המכון':''));
  if(by==='owner')say(b.custId,'bot','התור שלך ל'+svc(b.svc).name+' '+bDay(b.date)+' בשעה '+fmt(b.start)+' בוטל על ידי המכון. אפשר לקבוע מועד חדש.',menuBtns());
  fillSlot(b.date,b.start);
  return true;
}
/* first eligible waiting client (join order) gets a 30 minute hold; nobody eligible = back to normal availability */
/* offers go out only during opening hours and only if at least 30 minutes remain; outside hours the slot waits in S.queue for opening */
function fillSlot(date,start){
  if(startMs(date,start)-vnow()<HOLD*MIN){logEv('המועד '+dayLabel(date)+' '+fmt(start)+' חזר לזמינות רגילה (נותרו פחות מ-30 דקות, לא נשלחה הצעה)');return null}
  if(!inHours()){S.queue=S.queue||[];if(!S.queue.some(q=>q.date===date&&q.start===start))S.queue.push({date,start});
    logEv('המועד '+dayLabel(date)+' '+fmt(start)+' התפנה מחוץ לשעות הפעילות. ההצעה תישלח בפתיחה');return null}
  const key=date+'|'+start;
  const cands=S.waitlist.filter(w=>w.status==='waiting').sort((a,b)=>a.joined-b.joined);
  for(const w of cands){
    if(w.date&&w.date!==date)continue;
    if(w.from!=null&&(start<w.from||start>=w.to))continue;
    if((w.skip||[]).includes(key))continue;             /* she already declined or missed this exact slot */
    if(!isFree(date,start,w.svc)||custConflict(w.custId,date,start,w.svc))continue;
    const o={id:uid('o'),wlId:w.id,custId:w.custId,svc:w.svc,date,start,created:vnow(),expiresAt:Math.min(vnow()+HOLD*MIN,startMs(date,start)),status:'pending'};
    S.offers.push(o);w.status='offered';
    say(w.custId,'bot','התפנה מועד ל'+svc(w.svc).name+'!\n'+dayLabel(date)+' בשעה '+fmt(start)+'.\nשמרנו אותו עבורך ל-30 דקות. לאשר?',[{l:'מאשרת',a:'oa|'+o.id},{l:'לא מתאים',a:'od|'+o.id}],o.id);
    logEv('הוצע מועד '+fmt(start)+' ל'+cust(w.custId).name+' (נשמר ל-30 דקות)');
    return o;
  }
  logEv('המועד '+dayLabel(date)+' '+fmt(start)+' חזר לזמינות רגילה (אין מועמדת מתאימה)');
  return null;
}
function closeOfferMsgs(o){(S.chats[o.custId]||[]).forEach(m=>{if(m.oid===o.id)m.used=true})}
function expireOffer(o){
  o.status='expired';o.resolved=vnow();closeOfferMsgs(o);
  backToList(o);
  say(o.custId,'bot','ההצעה ל-'+fmt(o.start)+' פגה והמועד עבר לבאה בתור. את נשארת ברשימת ההמתנה למועדים אחרים, ואפשר לצאת ממנה בכל עת.',[{l:'יציאה מרשימת ההמתנה',a:'wl'},{l:'תפריט',a:'menu'}]);
  logEv('ההצעה ל'+cust(o.custId).name+' פגה');
  fillSlot(o.date,o.start);
}
/* after a decline or expiry the client stays on the list for other slots, but is not offered this one again */
function backToList(o){const w=S.waitlist.find(x=>x.id===o.wlId);if(w&&w.status==='offered'){w.status='waiting';(w.skip=w.skip||[]).push(o.date+'|'+o.start)}}
function respondOffer(oid,cid,accept){
  const o=S.offers.find(x=>x.id===oid);
  if(!o||o.custId!==cid){say(cid,'bot','לא ניתן לבצע את הפעולה הזו מהחשבון הזה.');logEv('נחסמה פעולה על הצעה של לקוחה אחרת');return}
  if(o.status!=='pending'){
    const why={expired:'פקעה',declined:'נדחתה',accepted:'כבר אושרה'}[o.status];
    say(cid,'bot','תגובה מאוחרת: ההצעה '+why+' והמועד אינו שמור עבורך. אפשר לבחור מועד אחר.',menuBtns());
    logEv('תגובה מאוחרת של '+cust(cid).name+' נדחתה');return;
  }
  const w=S.waitlist.find(x=>x.id===o.wlId);
  if(accept){
    if(custConflict(cid,o.date,o.start,o.svc)){say(cid,'bot','יש לך כבר תור שחופף למועד הזה, ולכן לא אישרתי אותו. ההצעה עדיין בתוקף.',[{l:'לא מתאים',a:'od|'+o.id}],o.id);return}
    if(!commit()){say(cid,'bot','לא הצלחתי לשמור את התור בגלל תקלה, ולכן הוא עדיין לא נקבע. המועד נשאר שמור עבורך עד שההצעה תפקע.',[{l:'לנסות שוב',a:'oa|'+o.id},{l:'לא מתאים',a:'od|'+o.id}],o.id);return}
    o.status='accepted';o.resolved=vnow();closeOfferMsgs(o);if(w)w.status='booked';
    const b=addBooking(cid,o.svc,o.date,o.start,'waitlist');
    const others=S.bookings.filter(x=>x.custId===cid&&x.status==='confirmed'&&x.id!==b.id&&x.date>=nowKey()).length;
    say(cid,'bot','התור נקבע ✅\n'+svc(o.svc).name+' · '+dayLabel(o.date)+' · '+fmt(o.start)+'\n'+svc(o.svc).price+' ₪'+(others?'\nההזמנה הקודמת שלך נשארה במקומה. אם תרצי לבטל אותה, אפשר לעשות זאת בנפרד.':''),menuBtns());
    logEv(cust(cid).name+' אישרה את המועד '+fmt(o.start)+', היומן עודכן');
  }else{
    o.status='declined';o.resolved=vnow();closeOfferMsgs(o);backToList(o);
    say(cid,'bot','בסדר, שחררתי את המועד. תודה שעדכנת.\nאת נשארת ברשימת ההמתנה למועדים אחרים.',[{l:'יציאה מרשימת ההמתנה',a:'wl'},{l:'תפריט',a:'menu'}]);
    logEv(cust(cid).name+' דחתה את ההצעה');
    fillSlot(o.date,o.start);
  }
}
function tickExpiry(){let n=0,again=true;
  while(again&&n<10){again=false;const o=S.offers.find(x=>x.status==='pending'&&x.expiresAt<=vnow());if(o){expireOffer(o);again=true;n++}}
  if(S.queue&&S.queue.length&&inHours()){const q=S.queue;S.queue=[];q.forEach(x=>fillSlot(x.date,x.start));n++}
  return n>0}
function advance(mins){setClock(vnow()+mins*MIN);tickExpiry()}
function paused(cid){return S.handovers.some(h=>h.custId===cid&&h.status==='open')}
function handover(cid,topic){
  const h={id:uid('h'),custId:cid,topic,status:'open',created:vnow(),thread:(S.chats[cid]||[]).filter(m=>m.from!=='sys').slice(-6).map(m=>({from:m.from,text:m.text}))};
  S.handovers.push(h);logEv('פנייה לטיפול אנושי: '+topic+' ('+cust(cid).name+')');
  say(cid,'bot','הפנייה שלך בנושא "'+topic+'" הועברה לבעלת המכון יחד עם הקשר השיחה. היא תחזור אליך אישית. המענה האוטומטי בנושא הזה מושהה.',[{l:'קביעת תור',a:'book'},{l:'התורים שלי',a:'mine'}]);
}

/* ---------- chat agent (rule based, no AI model) ---------- */
function text(cid,t){
  say(cid,'me',t);
  const x=t.trim();
  if(/רפוא|אלרג|הריון|הרה|תרופ|דלקת|פריחה|כאב|כואב|נפיחות|שרפה|כוויה|החזר|כסף בחזרה|זיכוי|תלונ|נורא|גרוע|לא מרוצ|מוגז|עצבנ/.test(x)){
    handover(cid,/החזר|כסף|זיכוי/.test(x)?'בקשת החזר':/תלונ|נורא|גרוע|מרוצ|עצבנ|מוגז/.test(x)?'תלונה':'שאלה רפואית');return}
  if(paused(cid)){say(cid,'sys','הודעה נוספת הועברה לבעלת המכון. המענה האוטומטי בנושא מושהה.');const h=S.handovers.find(h=>h.custId===cid&&h.status==='open');if(h)h.thread.push({from:'me',text:x});return}
  if(/^(היי|הי|שלום|בוקר|ערב|אהלן|מה נשמע)/.test(x)){run(cid,'menu');return}
  /* a service that is not in the catalogue: no invented price, the owner decides */
  if(/לייזר|הסרת שיער|שעווה|פדיקור|ריסים|איפור|מסאז|עיסוי|בוטוקס|חומצה היאלורונית|לק ג'ל|ג׳ל|שיזוף|קעקוע|הלבנת שיניים|תספורת|צבע לשיער/.test(x)){
    say(cid,'bot','השירות הזה לא מופיע בקטלוג שלנו, ולכן אין לי מחיר או זמינות עבורו. השירותים הקיימים: '+SERVICES.map(s=>s.name).join(', ')+'.');
    handover(cid,'שירות שאינו בקטלוג');return}
  /* an hour outside opening hours, or Saturday: exceptional request for the owner */
  const wantsBook=/תור|לקבוע|לזמין|פנוי|להגיע/.test(x);
  if(wantsBook){const tm=x.match(/(\d{1,2}):(\d{2})/);const open=Object.values(S.hours).filter(Boolean);
    const lo=Math.min(...open.map(h=>h[0])),hi=Math.max(...open.map(h=>h[1]));
    const m=tm?+tm[1]*60+ +tm[2]:null;
    if(/שבת/.test(x)||(m!=null&&(m<lo||m>=hi))){
      say(cid,'bot','המועד שביקשת מחוץ לשעות הפעילות הרגילות.\n'+hoursText());
      handover(cid,'בקשה למועד חריג');return}}
  if(/מחיק|למחוק|פרטיות/.test(x)){run(cid,'priv');return}
  if(/ביטול|לבטל/.test(x)){run(cid,'cancel');return}
  if(/המתנה/.test(x)){run(cid,'wl');return}
  if(/התורים שלי|מתי התור|התור שלי/.test(x)){run(cid,'mine');return}
  const sv=SERVICES.find(s=>x.includes(s.name.split(' ')[1]||s.name)||x.includes(s.name));
  if(sv&&/תור|לקבוע|לזמין|רוצה|אשמח/.test(x)){run(cid,'svc|'+sv.id);return}
  if(/תור|לקבוע|לזמין|פנוי|זמינות/.test(x)){run(cid,'book');return}
  if(/מחיר|עולה|כמה|עלות|שירות|טיפולים/.test(x)){run(cid,'info');return}
  if(/שעות|פתוח|סגור|מתי אתם/.test(x)){say(cid,'bot',hoursText(),menuBtns());return}
  if(/כתובת|איפה|נמצא|חניה/.test(x)){say(cid,'bot','הכתובת בסביבת ההדגמה: רחוב הדוגמה 12, עיר לדוגמה (כתובת פיקטיבית).',menuBtns());return}
  handover(cid,'פנייה שהסוכנת לא הבינה');
}
/* removes the client's data; freed slots and held offers go on to the next in line */
function deleteAccount(cid){
  const freed=[];
  S.waitlist=S.waitlist.filter(w=>w.custId!==cid);
  S.offers.filter(o=>o.custId===cid&&o.status==='pending').forEach(o=>{o.status='declined';o.resolved=vnow();freed.push(o)});
  S.bookings.filter(b=>b.custId===cid&&b.status==='confirmed'&&startMs(b.date,b.start)>vnow()).forEach(b=>cancelBooking(b.id,cid));
  freed.forEach(o=>fillSlot(o.date,o.start));
  S.bookings=S.bookings.filter(b=>b.custId!==cid);
  S.offers=S.offers.filter(o=>o.custId!==cid);
  S.handovers=S.handovers.filter(h=>h.custId!==cid);
  S.chats[cid]=[{id:++S.seq,from:'sys',text:'נתוני החשבון נמחקו לבקשתך. זהו חשבון הדגמה, ולכן הוא נפתח מחדש ריק.'}].concat(introMsgs(cust(cid),()=>++S.seq,fmt(nowMin())));
  logEv('נתוני החשבון של '+cust(cid).name+' נמחקו לבקשתה');
}
function hoursText(){return 'שעות הפעילות:\n'+[0,1,2,3,4,5,6].map(i=>{const h=S.hours[i];return 'יום '+DAYS[i]+': '+(h?fmt(h[0])+'–'+fmt(h[1]):'סגור')}).join('\n')}
function run(cid,a,label,mid){
  if(cid!==S.cur){toast('אי אפשר לפעול בשם לקוחה אחרת');return}
  const src=(S.chats[cid]||[]).find(m=>m.id===mid);if(src)src.used=true;
  if(label)say(cid,'me',label);
  const p=a.split('|'),k=p[0];
  const svcBtns=pre=>SERVICES.map(s=>({l:s.name+' · '+s.price+' ₪',a:pre+s.id}));
  const dayBtns=(sid,list)=>list.map(d=>({l:dayLabel(d).replace('יום ','').replace(/^(היום|מחר), /,'')+(d===nowKey()?' (היום)':''),a:'day|'+sid+'|'+d}));
  switch(k){
    case 'menu':say(cid,'bot','במה אפשר לעזור?',menuBtns());break;
    case 'info':say(cid,'bot',SERVICES.map(s=>'• '+s.name+': '+s.dur+' דקות, '+s.price+' ₪').join('\n')+'\nבין טיפולים יש '+BUF+' דקות התארגנות.\n\n'+hoursText(),[{l:'קביעת תור',a:'book'},{l:'תפריט',a:'menu'}]);break;
    case 'book':say(cid,'bot','איזה טיפול תרצי לקבוע?',svcBtns('svc|'));break;
    case 'svc':{const sid=p[1];const days=openDays(10).filter(d=>freeSlots(d,sid).length).slice(0,5);
      if(!days.length){say(cid,'bot','אין כרגע מועדים פנויים ל'+svc(sid).name+'. אפשר להצטרף לרשימת המתנה ונעדכן אותך כשיתפנה מועד.',[{l:'הצטרפות לרשימת המתנה',a:'wls|'+sid},{l:'תפריט',a:'menu'}]);break}
      say(cid,'bot','ל'+svc(sid).name+' ('+svc(sid).dur+' דק׳, '+svc(sid).price+' ₪) יש מועדים בימים האלה. איזה יום מתאים?',dayBtns(sid,days).concat([{l:'רשימת המתנה',a:'wls|'+sid}]));break}
    case 'day':{const sid=p[1],date=p[2];const sl=freeSlots(date,sid).slice(0,9);
      if(!sl.length){say(cid,'bot','הימים התמלאו בינתיים. אפשר להצטרף לרשימת המתנה.',[{l:'הצטרפות לרשימת המתנה',a:'wld|'+sid+'|'+date},{l:'יום אחר',a:'svc|'+sid}]);break}
      say(cid,'bot','שעות פנויות '+bDay(date)+':',sl.map(m=>({l:fmt(m),a:'slot|'+sid+'|'+date+'|'+m})).concat([{l:'יום אחר',a:'svc|'+sid}]));break}
    case 'slot':{const sid=p[1],date=p[2],m=+p[3];
      say(cid,'bot','לאשר '+svc(sid).name+' '+bDay(date)+' בשעה '+fmt(m)+'? ('+svc(sid).price+' ₪)',[{l:'אישור התור',a:'ok|'+sid+'|'+date+'|'+m},{l:'שעה אחרת',a:'day|'+sid+'|'+date}]);break}
    case 'ok':{const sid=p[1],date=p[2],m=+p[3];
      if(!isFree(date,m,sid)||custConflict(cid,date,m,sid)){say(cid,'bot','המועד כבר נתפס או חופף לתור אחר שלך. נבחר שעה אחרת?',[{l:'שעות פנויות',a:'day|'+sid+'|'+date}]);break}
      if(!commit()){say(cid,'bot','לא הצלחתי לשמור את התור בגלל תקלה, ולכן הוא לא נקבע. אפשר לנסות שוב.',[{l:'לנסות שוב',a:'ok|'+sid+'|'+date+'|'+m},{l:'שעה אחרת',a:'day|'+sid+'|'+date}]);break}
      const b=addBooking(cid,sid,date,m,'chat');logEv(cust(cid).name+' קבעה '+svc(sid).name+' '+dayLabel(date)+' '+fmt(m));
      say(cid,'bot','התור נקבע ✅\n'+svc(sid).name+' · '+dayLabel(date)+' · '+fmt(m)+'\n'+svc(sid).price+' ₪. נשמח לראות אותך!',menuBtns());break}
    case 'mine':{const bs=S.bookings.filter(b=>b.custId===cid&&b.status==='confirmed'&&startMs(b.date,b.start)>vnow()).sort((a,b)=>startMs(a.date,a.start)-startMs(b.date,b.start));
      const ws=S.waitlist.filter(w=>w.custId===cid&&(w.status==='waiting'||w.status==='offered'));
      say(cid,'bot',(bs.length?'התורים שלך:\n'+bs.map(b=>'• '+svc(b.svc).name+' · '+dayLabel(b.date)+' · '+fmt(b.start)).join('\n'):'אין לך תורים עתידיים.')+(ws.length?'\n\nברשימת המתנה: '+ws.map(wlDesc).join(', '):''),menuBtns());break}
    case 'cancel':{const bs=S.bookings.filter(b=>b.custId===cid&&b.status==='confirmed'&&startMs(b.date,b.start)>vnow());
      const started=S.bookings.filter(b=>b.custId===cid&&b.status==='confirmed'&&b.date===nowKey()&&startMs(b.date,b.start)<=vnow());
      if(!bs.length&&!started.length){say(cid,'bot','לא נמצאו תורים עתידיים לביטול.',menuBtns());break}
      if(!bs.length){handover(cid,'ביטול אחרי תחילת התור ('+svc(started[0].svc).name+' '+fmt(started[0].start)+')');break}
      say(cid,'bot','איזה תור לבטל?'+(started.length?'\nתור שכבר התחיל אפשר לבטל רק דרך בעלת המכון.':''),bs.map(b=>({l:svc(b.svc).name+' · '+dayLabel(b.date).replace(/^(היום|מחר), /,'')+' '+fmt(b.start),a:'cx|'+b.id})).concat(started.map(b=>({l:'שכבר התחיל: '+svc(b.svc).name+' '+fmt(b.start),a:'cxlate|'+b.id}))));break}
    case 'cxlate':{const b=S.bookings.find(x=>x.id===p[1]);
      if(!b||b.custId!==cid){say(cid,'bot','לא ניתן לבצע את הפעולה הזו מהחשבון הזה.',menuBtns());break}
      handover(cid,'ביטול אחרי תחילת התור ('+svc(b.svc).name+' '+fmt(b.start)+')');break}
    case 'cx':{const b=S.bookings.find(x=>x.id===p[1]);
      if(!b||b.custId!==cid||b.status!=='confirmed'){say(cid,'bot','לא ניתן לבטל את התור הזה.',menuBtns());break}
      say(cid,'bot','בטוחה שלבטל '+svc(b.svc).name+' '+bDay(b.date)+' בשעה '+fmt(b.start)+'?',[{l:'כן, לבטל',a:'cxok|'+b.id},{l:'לא, להשאיר',a:'menu'}]);break}
    case 'cxok':{const b=S.bookings.find(x=>x.id===p[1]);
      if(b&&b.custId===cid&&b.status==='confirmed'&&startMs(b.date,b.start)<=vnow()){handover(cid,'ביטול אחרי תחילת התור ('+svc(b.svc).name+' '+fmt(b.start)+')');break}
      if(b&&b.custId===cid&&b.status==='confirmed'&&!commit()){say(cid,'bot','לא הצלחתי לשמור את הביטול בגלל תקלה, ולכן התור עדיין קיים. אפשר לנסות שוב.',[{l:'לנסות שוב',a:'cxok|'+b.id},{l:'תפריט',a:'menu'}]);break}
      if(cancelBooking(p[1],cid))say(cid,'bot','התור בוטל. תודה שעדכנת אותנו 🌸',menuBtns());else say(cid,'bot','לא ניתן לבטל את התור הזה.',menuBtns());break}
    case 'wl':{const act=S.waitlist.filter(w=>w.custId===cid&&(w.status==='waiting'||w.status==='offered'));
      say(cid,'bot','לאיזה טיפול להצטרף לרשימת ההמתנה?'+(act.length?'\nאפשר גם לצאת מרשימה שאת כבר בה:':''),svcBtns('wls|').concat(act.map(w=>({l:'יציאה: '+wlDesc(w),a:'wlx|'+w.id}))));break}
    case 'wls':{const sid=p[1];say(cid,'bot','באיזה יום?',openDays(5).map(d=>({l:dayLabel(d).replace('יום ','').replace(/^(היום|מחר), /,''),a:'wld|'+sid+'|'+d})).concat([{l:'כל יום',a:'wld|'+sid+'|any'}]));break}
    case 'wld':{const sid=p[1],d=p[2];
      say(cid,'bot','באיזה חלק של היום נוח לך?',TR.map(t=>({l:t[0]+' ('+fmt(t[1])+'–'+fmt(t[2])+')',a:'wlc|'+sid+'|'+d+'|'+t[1]+'|'+t[2]})).concat([{l:'כל שעה',a:'wlc|'+sid+'|'+d+'|any|any'}]));break}
    case 'wlc':{const [,sid,d,f,t]=p;
      say(cid,'bot','לפני ההצטרפות: אם יתפנה מועד מתאים, אשלח לך הצעה ואשמור את המועד 30 דקות. נשמרים הטיפול, ההעדפות ומועד ההצטרפות, רק לצורך הצעת מועדים. אפשר לצאת מהרשימה בכל עת.\nמסכימה להצטרף?',[{l:'מסכימה ומצטרפת',a:'wlj|'+sid+'|'+d+'|'+f+'|'+t},{l:'לא עכשיו',a:'menu'}]);break}
    case 'wlj':{const sid=p[1],d=p[2]==='any'?null:p[2],f=p[3]==='any'?null:+p[3],t=p[4]==='any'?null:+p[4];
      if(S.waitlist.some(w=>w.custId===cid&&w.svc===sid&&(w.status==='waiting'||w.status==='offered')&&w.date===d&&w.from===f)){say(cid,'bot','את כבר ברשימת ההמתנה לטיפול הזה.',menuBtns());break}
      if(!commit()){say(cid,'bot','לא הצלחתי לשמור את ההצטרפות בגלל תקלה. אפשר לנסות שוב.',[{l:'לנסות שוב',a:a},{l:'תפריט',a:'menu'}]);break}
      const w={id:uid('w'),custId:cid,svc:sid,date:d,from:f,to:t,joined:vnow(),status:'waiting',consent:true,skip:[]};
      S.waitlist.push(w);logEv(cust(cid).name+' הצטרפה לרשימת המתנה: '+wlDesc(w));
      say(cid,'bot','נרשמת להמתנה: '+wlDesc(w)+'.\nכשיתפנה מועד מתאים נציע אותו לפי סדר ההצטרפות ונשמור אותו עבורך 30 דקות.',menuBtns());break}
    case 'wlx':{const w=S.waitlist.find(x=>x.id===p[1]);
      if(!w||w.custId!==cid||!(w.status==='waiting'||w.status==='offered')){say(cid,'bot','לא מצאתי את הרישום הזה ברשימת ההמתנה שלך.',menuBtns());break}
      const o=S.offers.find(x=>x.wlId===w.id&&x.status==='pending');
      w.status='left';w.left=vnow();logEv(cust(cid).name+' יצאה מרשימת ההמתנה: '+wlDesc(w));
      if(o){o.status='declined';o.resolved=vnow();closeOfferMsgs(o)}
      say(cid,'bot','יצאת מרשימת ההמתנה ל'+wlDesc(w)+'. לא אשלח לך עוד הצעות עבור הרישום הזה.',menuBtns());
      if(o)fillSlot(o.date,o.start);break}
    case 'priv':say(cid,'bot','פרטיות בסביבת ההדגמה:\n• את רואה ופועלת רק בתורים וברשימת ההמתנה שלך.\n• נשמרים: שם, טלפון, תורים, רשימת המתנה ותוכן השיחה, רק לצורך ניהול התורים.\n• לא נאסף מידע רפואי. שאלות רפואיות מועברות לבעלת המכון.\n• הנתונים נשמרים רק בדפדפן הזה.',[{l:'מחיקת החשבון שלי',a:'del'},{l:'יציאה מרשימת המתנה',a:'wl'},{l:'תפריט',a:'menu'}]);break;
    case 'del':{const nb=S.bookings.filter(b=>b.custId===cid&&b.status==='confirmed'&&startMs(b.date,b.start)>vnow()).length,nw=S.waitlist.filter(w=>w.custId===cid&&(w.status==='waiting'||w.status==='offered')).length;
      say(cid,'bot','מחיקת חשבון ההדגמה תבטל '+nb+' תורים עתידיים, תוציא אותך מ-'+nw+' רישומים ברשימת ההמתנה ותמחק את השיחה ואת ההיסטוריה שלך. אי אפשר לשחזר זאת. למחוק?',[{l:'כן, למחוק הכול',a:'delok'},{l:'לא',a:'menu'}]);break}
    case 'delok':deleteAccount(cid);break;
    case 'oa':respondOffer(p[1],cid,true);break;
    case 'od':respondOffer(p[1],cid,false);break;
    case 'human':handover(cid,'בקשה לשיחה אישית');break;
  }
  save();render();
}

/* ---------- rendering ---------- */
function pendingOffers(cid){return S.offers.filter(o=>o.status==='pending'&&(!cid||o.custId===cid))}
/* customer side panel: hourglass + live countdown for the slot held for this waitlist entry */
function offerChip(w){const o=S.offers.find(x=>x.wlId===w.id&&x.status==='pending');
  return o?`<span class="hg" aria-hidden="true">⏳</span>הוצע מועד · <b data-exp="${o.expiresAt}">${cd(o.expiresAt-vnow())}</b>`:'הוצע מועד'}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;$('#toasts').appendChild(e);setTimeout(()=>e.remove(),3200)}
function render(){
  const app=$('#app');
  const keepScroll=window.scrollY;
  app.innerHTML=
   `<div class="wrap"><header class="top">
      <div class="brand"><div class="mark"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F0DAD5" stroke-width="1.6" stroke-linecap="round"><path d="M12 21c-4-2-6-5-6-8 3 0 5 1 6 3 1-2 3-3 6-3 0 3-2 6-6 8z"/><path d="M12 16c-2-2-2-6 0-9 2 3 2 7 0 9z"/></svg></div>
        <div><b>${I18N[LANG].brand}</b><small>${I18N[LANG].tagline}</small></div></div>
      <div class="seg" role="group" aria-label="תצוגה">
        <button data-do="mode" data-v="customer" aria-pressed="${S.mode==='customer'}">${I18N[LANG].chat}</button>
        <button data-do="mode" data-v="about" aria-pressed="${S.mode==='about'}">על המכון</button>
        <button data-do="mode" data-v="admin" aria-pressed="${S.mode==='admin'}">${I18N[LANG].admin}${S.handovers.some(h=>h.status==='open')?' <span class="badge">'+S.handovers.filter(h=>h.status==='open').length+'</span>':''}</button>
      </div></header>
    <div class="banner"><span><b>סביבת הדגמה.</b> כל השמות והנתונים פיקטיביים. אין חיבור אמיתי ל-WhatsApp, לתשלום או להודעות.</span><span class="clock">שעון הדגמה: <span id="clk">${clockLabel()}</span></span></div>
    ${S.mode==='customer'?customerView():S.mode==='about'?aboutView():adminView()}</div>${dock()}`;
  const ms=$('.msgs');if(ms)ms.scrollTop=ms.scrollHeight;
  window.scrollTo(0,keepScroll);
  ui.animFrom=S.seq;ui.flash=null;
}
function customerView(){
  const th=S.chats[S.cur]||[];
  const chips=CUSTOMERS.map(c=>{const n=pendingOffers(c.id).length;return `<button class="pill" data-do="cust" data-id="${c.id}" aria-pressed="${S.cur===c.id}">${esc(c.name)}${n?'<span class="badge">'+n+'</span>':''}</button>`}).join('');
  const msgs=th.map(m=>{
    if(m.from==='sys')return `<div class="sys">${esc(m.text)}</div>`;
    const pop=m.id>ui.animFrom?' pop':'';
    let extra='';if(m.oid){const o=S.offers.find(x=>x.id===m.oid);if(o&&o.status==='pending')extra=`<div class="cd"><span class="hg" aria-hidden="true">⏳</span>נשמר עבורך עוד <b data-exp="${o.expiresAt}">${cd(o.expiresAt-vnow())}</b></div>`}
    const btns=m.btns?`<div class="opts">${m.btns.map(b=>`<button class="opt" data-do="act" data-a="${esc(b.a)}" data-l="${esc(b.l)}" data-m="${m.id}" ${m.used?'disabled':''}>${esc(b.l)}</button>`).join('')}</div>`:'';
    const who=m.from==='bot'?'סוכנת תור חכם':m.from==='owner'?'בעלת המכון':'';
    return `<div class="m ${m.from}${pop}">${who?'<span class="who">'+who+'</span>':''}${esc(m.text||'').replace(/\n/g,'<br>')}${extra}${btns}<small>${m.t||''}</small></div>`}).join('');
  const mine=S.bookings.filter(b=>b.custId===S.cur&&b.status==='confirmed').sort((a,b)=>startMs(a.date,a.start)-startMs(b.date,b.start));
  const wl=S.waitlist.filter(w=>w.custId===S.cur&&(w.status==='waiting'||w.status==='offered'));
  return `<div class="pill-row" style="margin-top:18px"><span class="muted" style="align-self:center">מצב הדגמה, מדברת בתור:</span>${chips}</div>
  <div class="grid cust">
   <section class="phone" aria-label="שיחת WhatsApp מדומה">
     <div class="phone-h"><div class="avatar">ת</div><div><b>תור חכם · קליניקה לדוגמה</b><small>${paused(S.cur)?'המענה האוטומטי מושהה, ממתינה לבעלת המכון':'סוכנת אוטומטית · סימולציה'}</small></div></div>
     <div class="msgs" id="msgs">${msgs}</div>
     <div class="quick">${[['book','קביעת תור'],['cancel','ביטול'],['wl','המתנה'],['mine','התורים שלי'],['human','בעלת המכון']].map(q=>`<button class="opt" data-do="act" data-a="${q[0]}" data-l="${q[1]}" data-m="0">${q[1]}</button>`).join('')}</div>
     <form class="composer" id="cform"><input id="cin" autocomplete="off" placeholder="כתבי הודעה, למשל: מה המחיר של מניקור?" aria-label="הודעה"><button class="btn pri" type="submit">שליחה</button></form>
   </section>
   <aside class="side grid">
     <div class="card"><h3>התורים של ${esc(first(cust(S.cur).name))}</h3>
       ${mine.length?mine.map(b=>`<div class="li"><div><b>${svc(b.svc).name}</b><div class="note">${dayLabel(b.date)} · ${fmt(b.start)}${b.source==='waitlist'?' · מרשימת המתנה':''}</div></div><span class="chip ok">${svc(b.svc).price} ₪</span></div>`).join(''):'<p class="muted">אין תורים קרובים.</p>'}
       ${wl.length?'<h3 style="font-size:16px;margin-top:14px">ברשימת המתנה</h3>'+wl.map(w=>`<div class="li"><span>${esc(wlDesc(w))}</span><span><span class="chip ${w.status==='offered'?'rose':'soft'}">${w.status==='offered'?offerChip(w):'ממתינה'}</span> <button class="btn ghost sm" data-do="act" data-a="wlx|${w.id}" data-l="יציאה מרשימת ההמתנה" data-m="0">יציאה</button></span></div>`).join(''):''}
     </div>
     <div class="card plain"><h3 style="font-size:18px">פרטיות</h3><p class="note" style="margin:6px 0 0">כל לקוחה רואה ופועלת רק בחשבון שלה. בעלת המכון רואה את כולן בממשק הניהול. נשמרים שם, טלפון, תורים, רשימת המתנה ותוכן השיחה, רק בדפדפן הזה. לא נאסף מידע רפואי.</p>
       <button class="btn ghost sm" style="margin-top:10px" data-do="act" data-a="del" data-l="מחיקת החשבון שלי" data-m="0">מחיקת החשבון שלי</button></div>
   </aside></div>`;
}

  return `<section class="hero"><img src="${IMG.clinic}" alt="חדר טיפולים בגוונים חמים, תמונת אווירה"><div class="cap"><h1>תור חכם</h1><p>תורים, תזכורות ושירות לקוחות במקום אחד, בעיצוב חם ורגוע למכון קוסמטיקה.</p></div></section>
  <div class="sample" style="margin-top:12px"><b>תוכן לדוגמה.</b> התמונות הן תמונות אווירה שנוצרו בבינה מלאכותית ואינן צילומים של המכון, והכיתובים על המוצרים בהן אינם אמיתיים. הסיפור של המכון עדיין לא נכתב, ואפשר להחליף אותו בסיפור וצילומים אמיתיים.</div>

     <p class="muted" style="margin:0">כדי למלא: שלחי לי כמה משפטים (שנת הקמה, ניסיון, הכשרה, ערכים) ואכניס אותם כאן.</p></section>

     <ul class="tl">
       <li><b>1 בנובמבר 2026</b><span class="muted">נוצרו בעיצוב 12 מסכים בעברית ו-3 מערכות עיצוב: יומן, רשימת המתנה, פניות לטיפול אנושי וסימולטור WhatsApp.</span></li>
       <li><b>8 בנובמבר 2026</b><span class="muted">הוגדרו הדרישות, נבחרה פלטת קרם, בז', ורוד מעושן ובורדו, ונבנה אבטיפוס עם ממשק ניהול ומצב הצגה.</span></li>
       <li class="next"><b>בשלב הבא</b><span class="muted">ערבית ואנגלית, שירותים ועובדות נוספים, תזכורות ומשוב אחרי טיפול.</span></li>
     </ul></section></div>
  <h2 style="margin-top:28px">הטיפולים שלנו</h2>

function adminView(){
  const tabs=[['day','יומן יומי'],['avail','זמינות'],['wl','רשימת המתנה'],['ho','פניות לטיפול אנושי'],['stats','מדדים']];
  const open=S.handovers.filter(h=>h.status==='open').length;
  const body={day:adminDayView,avail:availView,wl:wlView,ho:hoView,stats:statsView}[S.tab]();
  return `<nav class="tabs" aria-label="ניהול">${tabs.map(t=>`<button data-do="tab" data-v="${t[0]}" aria-pressed="${S.tab===t[0]}">${t[1]}${t[0]==='ho'&&open?'<span class="badge">'+open+'</span>':''}${t[0]==='wl'&&pendingOffers().length?'<span class="badge">'+pendingOffers().length+'</span>':''}</button>`).join('')}</nav>${body}`;
}
function adminDayView(){
  const k=S.adminDay,days=openDays(14);if(!days.includes(k)&&S.hours[dof(k).getDay()])days.push(k);days.sort();
  const i=days.indexOf(k),h=S.hours[dof(k).getDay()];
  let list='',cur=h?h[0]:0;
  if(!h)list='<p class="muted">המכון סגור ביום הזה.</p>';
  else{
    busy(k).forEach(x=>{
      if(x.s-cur>=20)list+=`<div class="gap"><span>פנוי</span><span>${fmt(cur)}–${fmt(x.s)}</span></div>`;
      cur=Math.max(cur,x.e);
      if(x.k==='b'){const b=x.ref,sv=svc(b.svc);
        list+=`<div class="slot${ui.flash===b.id?' flash':''}"><div class="t">${fmt(b.start)}<small>עד ${fmt(b.start+sv.dur)}</small></div>
          <div><b>${esc(cust(b.custId).name)}</b> · ${sv.name}<div class="note">${sv.price} ₪ · +${BUF} דק׳ התארגנות${b.source==='waitlist'?' · נקבע מרשימת המתנה':''}</div></div>
          <div>${ui.confirm===b.id?`<button class="btn pri sm" data-do="ocx" data-id="${b.id}">כן, לבטל</button> <button class="btn ghost sm" data-do="ocxno">לא</button>`:`<span class="chip ok">מאושר</span> <button class="btn ghost sm" data-do="ocxask" data-id="${b.id}">ביטול</button>`}</div></div>`}
      else if(x.k==='o'){const o=x.ref;
        list+=`<div class="slot hold"><div class="t">${fmt(o.start)}<small>מוחזק</small></div><div><b>נשמר ל${esc(cust(o.custId).name)}</b> · ${svc(o.svc).name}<div class="note">חסום להזמנות אחרות עד אישור, דחייה או פקיעה</div></div><span class="chip rose"><b data-exp="${o.expiresAt}">${cd(o.expiresAt-vnow())}</b></span></div>`}
      else list+=`<div class="slot block"><div class="t">${fmt(x.s)}<small>עד ${fmt(x.e)}</small></div><div><b>${esc(x.ref.reason||'חסום')}</b></div><button class="btn ghost sm" data-do="unblock" data-id="${x.ref.id}">הסרה</button></div>`;
    });
    if(h[1]-cur>=20)list+=`<div class="gap"><span>פנוי</span><span>${fmt(cur)}–${fmt(h[1])}</span></div>`;
    if(!busy(k).length)list=`<div class="gap"><span>אין תורים ביום הזה</span><span>${fmt(h[0])}–${fmt(h[1])}</span></div>`;
  }
  const log=S.log.slice(0,9).map(l=>`<div class="li"><span>${esc(l.text)}</span><span class="note">${fmt(Math.floor((l.t%864e5)/MIN)+0)==='NaN'?'':fmtTime(l.t)}</span></div>`).join('')||'<p class="muted">עדיין אין פעילות.</p>';
  return `<div class="grid two"><section class="card"><div class="dayhead"><h2>${dayLabel(k)}</h2>
     <button class="btn sec sm" data-do="day" data-v="${i-1}" ${i<=0?'disabled':''}>הקודם</button>
     <button class="btn sec sm" data-do="day" data-v="${i+1}" ${i>=days.length-1?'disabled':''}>הבא</button></div>${list}</section>
   <aside class="card"><h3 style="margin-bottom:8px">פעילות אחרונה</h3>${log}</aside></div>`;
}
function fmtTime(ms){const d=new Date(ms);return pad(d.getHours())+':'+pad(d.getMinutes())}
function availView(){
  const rows=[0,1,2,3,4,5,6].map(i=>{const h=S.hours[i];return `<div style="display:contents"><b>יום ${DAYS[i]}</b><div class="r"><label class="note"><input type="checkbox" data-hr="${i}" data-f="open" ${h?'checked':''}> פתוח</label>${h?`<input type="time" step="1800" value="${fmt(h[0])}" data-hr="${i}" data-f="from" aria-label="פתיחה"> עד <input type="time" step="1800" value="${fmt(h[1])}" data-hr="${i}" data-f="to" aria-label="סגירה">`:''}</div></div>`}).join('');
  const days=openDays(10);
  const blocks=S.blocks.filter(b=>b.date>=nowKey()).sort((a,b)=>a.date<b.date?-1:1).map(b=>`<div class="li"><span><b>${esc(b.reason||'חסימה')}</b><div class="note">${dayLabel(b.date)} · ${fmt(b.start)}–${fmt(b.end)}</div></span><button class="btn ghost sm" data-do="unblock" data-id="${b.id}">הסרה</button></div>`).join('')||'<p class="muted">אין חסימות.</p>';
  const tm=[];for(let m=540;m<=1140;m+=30)tm.push(m);
  return `<div class="grid two"><section class="card"><h2 style="margin-bottom:12px">שעות פעילות</h2><div class="hrs">${rows}</div>
     <p class="note" style="margin-top:12px">שינוי שעות משפיע מיד על הזמינות שהלקוחות רואות. תורים קיימים לא נמחקים.</p></section>
    <aside class="grid"><div class="card"><h3 style="margin-bottom:10px">חסימת זמן</h3>
      <form class="form" id="bform"><div><label for="bd">יום</label><select id="bd">${days.map(d=>`<option value="${d}">${dayLabel(d)}</option>`).join('')}</select></div>
      <div><label for="bs">מ-</label><select id="bs">${tm.map(m=>`<option value="${m}">${fmt(m)}</option>`).join('')}</select></div>
      <div><label for="be">עד</label><select id="be">${tm.map(m=>`<option value="${m}" ${m===600?'selected':''}>${fmt(m)}</option>`).join('')}</select></div>
      <div style="grid-column:1/-1"><label for="br">סיבה</label><input id="br" placeholder="למשל: הפסקה, רופא שיניים"></div>
      <button class="btn pri" type="submit">חסימה</button></form>
      <div style="margin-top:14px">${blocks}</div></div>
     <div class="card plain soon"><h3 style="font-size:18px;margin-bottom:6px">בשלב הבא</h3><p class="note" style="margin:0">מבנה הנתונים כבר תומך בכמה שירותים ועובדות (${SERVICES.length} שירותים, ${STAFF.length} עובדת), ובמילון שפות. תזכורות ומשוב אחרי טיפול עדיין לא נבנו.</p></div></aside></div>`;
}
function wlView(){
  const stH={waiting:['ממתינה','soft'],offered:['הוצע מועד','rose'],booked:['נקבע','ok'],declined:['דחתה',''],expired:['ההצעה פגה',''],left:['יצאה מהרשימה','']};
  const rows=S.waitlist.slice().sort((a,b)=>a.joined-b.joined).map((w,i)=>`<tr><td>${i+1}</td><td><b>${esc(cust(w.custId).name)}</b></td><td>${svc(w.svc).name}</td><td>${w.date?dayLabel(w.date):'כל יום'}</td><td>${w.from!=null?fmt(w.from)+'–'+fmt(w.to):'כל שעה'}</td><td>${fmtTime(w.joined)}</td><td><span class="chip ${stH[w.status][1]}">${stH[w.status][0]}</span>${(w.skip||[]).length?`<div class="note">דילגה על ${w.skip.length} מועדים</div>`:''}</td></tr>`).join('');
  const q=(S.queue||[]).map(x=>`<div class="li"><span>${dayLabel(x.date)} · ${fmt(x.start)}</span><span class="chip soft">יוצע בפתיחה</span></div>`).join('');
  const offs=S.offers.slice().reverse().map(o=>`<div class="li"><span><b>${esc(cust(o.custId).name)}</b> · ${svc(o.svc).name} ${fmt(o.start)}<div class="note">${dayLabel(o.date)}</div></span>${o.status==='pending'?`<span class="chip rose">נשמר עוד <b data-exp="${o.expiresAt}">${cd(o.expiresAt-vnow())}</b></span>`:`<span class="chip">${{accepted:'אושרה',declined:'נדחתה',expired:'פגה'}[o.status]}</span>`}</div>`).join('')||'<p class="muted">עדיין לא נשלחו הצעות. בטלי תור כדי להתחיל.</p>';
  return `<div class="grid two"><section class="card"><h2 style="margin-bottom:10px">רשימת המתנה</h2><p class="note" style="margin-top:0">הסדר לפי מועד ההצטרפות. הצעה נשלחת רק בשעות הפעילות, רק אם נותרו לפחות 30 דקות עד התור, ונשמרת ל-30 דקות. מי שדחתה או לא הגיבה נשארת ברשימה למועדים אחרים.</p><div class="tblwrap"><table><thead><tr><th>#</th><th>לקוחה</th><th>טיפול</th><th>יום</th><th>שעות</th><th>הצטרפה</th><th>סטטוס</th></tr></thead><tbody>${rows}</tbody></table></div></section>
   <aside class="card"><h3 style="margin-bottom:8px">הצעות מועד</h3>${offs}${q?'<h3 style="font-size:16px;margin:14px 0 6px">ממתינים לשעות הפעילות</h3>'+q:''}</aside></div>`;
}
function hoView(){
  const list=S.handovers.slice().reverse().map(h=>`<div class="ho"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><b>${esc(cust(h.custId).name)} · ${esc(h.topic)}</b><span class="chip ${h.status==='open'?'rose':''}">${h.status==='open'?'פתוחה':'טופלה'}</span></div>
    <div class="ctx">${h.thread.map(m=>`<div><b>${m.from==='me'?esc(first(cust(h.custId).name)):m.from==='owner'?'את':'סוכנת'}:</b> ${esc(m.text).replace(/\n/g,' ')}</div>`).join('')}</div>
    ${h.status==='open'?`<textarea id="hr-${h.id}" rows="2" placeholder="תשובה ללקוחה..." aria-label="תשובה"></textarea><div style="margin-top:8px"><button class="btn pri sm" data-do="resolve" data-id="${h.id}">שליחה וסימון כטופל</button></div>`:''}</div>`).join('')||'<p class="muted">אין פניות. נסי לכתוב בשיחה הודעה כמו "יש לי אלרגיה" או "אני רוצה החזר".</p>';
  return `<section class="card"><h2 style="margin-bottom:6px">פניות לטיפול אנושי</h2><p class="note" style="margin-top:0">שאלות רפואיות, החזרים, תלונות, מועדים חריגים, שירותים שאינם בקטלוג, ביטול אחרי תחילת התור ודברים שהסוכנת לא הבינה. המענה האוטומטי בנושא נעצר עד שתסמני כטופל.</p>${list}</section>`;
}
function statsView(){
  const today=nowKey(),conf=S.bookings.filter(b=>b.status==='confirmed');
  const occ=d=>{const h=S.hours[dof(d).getDay()];if(!h)return 0;return Math.round(conf.filter(b=>b.date===d).reduce((a,b)=>a+svc(b.svc).dur,0)/(h[1]-h[0])*100)};
  const days=openDays(7),wk=conf.filter(b=>days.includes(b.date)).reduce((a,b)=>a+svc(b.svc).price,0);
  const resolved=S.offers.filter(o=>o.status!=='pending'),acc=S.offers.filter(o=>o.status==='accepted').length;
  const canc=S.bookings.filter(b=>b.status==='cancelled').length;
  const bars=days.map(d=>`<div class="bar ${d===today?'today':''}"><span>${occ(d)}%</span><i style="height:${Math.max(3,occ(d))}%"></i><span>${DAYS[dof(d).getDay()]}</span></div>`).join('');
  return `<div class="grid"><div class="grid kpis">
   <div class="kpi"><b>${conf.filter(b=>b.date===today).length}</b><span>תורים היום</span></div>
   <div class="kpi"><b>${wk} ₪</b><span>הכנסה צפויה ב-7 ימי פעילות</span></div>
   <div class="kpi"><b>${occ(today)}%</b><span>תפוסה היום (לפי דקות טיפול)</span></div>
   <div class="kpi"><b>${canc}</b><span>ביטולים</span></div>
   <div class="kpi"><b>${resolved.length?Math.round(acc/resolved.length*100)+'%':'–'}</b><span>הצעות מהמתנה שהתקבלו (${acc} מתוך ${resolved.length})</span></div>
   <div class="kpi"><b>${S.waitlist.filter(w=>w.status==='waiting').length}</b><span>ממתינות ברשימה</span></div>
   <div class="kpi"><b>${S.handovers.filter(h=>h.status==='open').length}</b><span>פניות פתוחות</span></div></div>
   <section class="card"><h3 style="margin-bottom:4px">תפוסה לפי יום</h3><div class="bars">${bars}</div><p class="note">כל המספרים מחושבים מנתוני ההדגמה הנוכחיים ומתעדכנים בכל פעולה.</p></section></div>`;
}

/* ---------- presentation mode ---------- */
const STEPS=[
 {t:'דנה מזרחי מבטלת את טיפול הפנים של 10:30',run(){const b=S.bookings.find(x=>x.demo&&x.status==='confirmed');if(!b){toast('התור כבר בוטל. אפסי את הנתונים כדי לחזור על ההדגמה');return false}
   S.cur=b.custId;say(b.custId,'me','אני צריכה לבטל את התור');cancelBooking(b.id,b.custId);say(b.custId,'bot','התור בוטל. תודה שעדכנת אותנו 🌸',menuBtns());S.mode='admin';S.tab='wl';return true}},
 {t:'ההצעה הראשונה פוקעת (קידום שעון ב-31 דקות)',run(){advance(31);S.mode='admin';S.tab='wl';return true}},
 {t:'הלקוחה הבאה בתור מאשרת את המועד',run(){const o=pendingOffers()[0];if(!o){toast('אין הצעה פעילה');return false}
   S.cur=o.custId;S.mode='customer';say(o.custId,'me','מאשרת');respondOffer(o.id,o.custId,true);return true}},
 {t:'היומן מתעדכן',run(){const o=S.offers.find(x=>x.status==='accepted');S.mode='admin';S.tab='day';if(o)S.adminDay=o.date;return true}}];
function dock(){
  const steps=STEPS.map((s,i)=>`<div class="step ${S.demo>i?'done':''}"><span class="n">${S.demo>i?'✓':i+1}</span><span>${s.t}</span>${S.demo===i?`<button class="btn sm" data-do="step" data-v="${i}">בצעי</button>`:''}</div>`).join('');
  return `<div class="dock">${S.demoOpen?`<div class="panel"><h3>מצב הצגה</h3><p class="note" style="color:#E7CFCB;margin:4px 0 8px">כל שלב מפעיל את הלוגיקה האמיתית של האפליקציה.</p>${steps}
    <div class="row"><button class="btn sm" data-do="adv" data-v="15">+15 דק׳</button><button class="btn sm" data-do="adv" data-v="31">+31 דק׳</button><button class="btn sm" data-do="decline">דחיית ההצעה</button><button class="btn sm" data-do="failnext">${S.failNext?'כשל בשמירה: מוכן ✓':'כשל בשמירה הבאה'}</button><button class="btn sm" data-do="reset">איפוס נתונים</button></div></div>`:''}
    <button class="fab" data-do="demo">${S.demoOpen?'סגירת מצב הצגה':'מצב הצגה'}</button></div>`;
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-do]');if(!el)return;
  const d=el.dataset;
  switch(d.do){
    case 'mode':S.mode=d.v;break;
    case 'cust':S.cur=d.id;break;
    case 'bookfrom':S.mode='customer';run(S.cur,'svc|'+d.v,svc(d.v).name);return;
    case 'tab':S.tab=d.v;break;
    case 'act':run(S.cur,d.a,d.l,+d.m);return;
    case 'day':{const days=openDays(14);if(!days.includes(S.adminDay))days.push(S.adminDay);days.sort();const n=days[+d.v];if(n)S.adminDay=n;break}
    case 'ocxask':ui.confirm=d.id;break;
    case 'ocxno':ui.confirm=null;break;
    case 'ocx':ui.confirm=null;cancelBooking(d.id,'owner');toast('התור בוטל. מה קרה למועד מופיע ברשימת ההמתנה');break;
    case 'failnext':S.failNext=!S.failNext;toast(S.failNext?'הפעולה הבאה שנשמרת תיכשל':'סימולציית הכשל בוטלה');break;
    case 'unblock':S.blocks=S.blocks.filter(b=>b.id!==d.id);logEv('חסימה הוסרה');break;
    case 'resolve':{const h=S.handovers.find(x=>x.id===d.id);const ta=$('#hr-'+d.id);const t=ta&&ta.value.trim();
      if(!h)break;if(!t){toast('כתבי תשובה ללקוחה לפני הסימון');return}
      say(h.custId,'owner',t);say(h.custId,'sys','המענה האוטומטי חזר לפעול.');h.status='resolved';logEv('פנייה של '+cust(h.custId).name+' טופלה');break}
    case 'demo':S.demoOpen=!S.demoOpen;break;
    case 'step':{const i=+d.v;if(S.demo===i&&STEPS[i].run())S.demo=i+1;break}
    case 'adv':advance(+d.v);toast('השעון קודם ב-'+d.v+' דקות');break;
    case 'decline':{const o=pendingOffers()[0];if(!o){toast('אין הצעה פעילה');return}S.cur=o.custId;S.mode='customer';say(o.custId,'me','לא מתאים');respondOffer(o.id,o.custId,false);break}
    case 'reset':S=seed();S.demoOpen=true;toast('הנתונים אופסו');break;
  }
  save();render();
});
document.addEventListener('submit',e=>{
  if(e.target.id==='cform'){e.preventDefault();const i=$('#cin');const t=i.value.trim();if(!t)return;text(S.cur,t);save();render();const n=$('#cin');if(n)n.focus()}
  if(e.target.id==='bform'){e.preventDefault();
    const date=$('#bd').value,s=+$('#bs').value,en=+$('#be').value,reason=$('#br').value.trim();
    if(en<=s){toast('שעת הסיום חייבת להיות אחרי ההתחלה');return}
    if(busy(date).some(x=>s<x.e&&en>x.s)){toast('בזמן הזה יש תור או הצעה פעילה. בטלי אותם קודם');return}
    S.blocks.push({id:uid('x'),date,start:s,end:en,reason:reason||'חסימה'});logEv('נחסם זמן: '+dayLabel(date)+' '+fmt(s)+'–'+fmt(en));save();render();toast('הזמן נחסם')}
});
document.addEventListener('change',e=>{
  const el=e.target;if(el.dataset.hr===undefined)return;
  const i=+el.dataset.hr;let h=S.hours[i];
  if(el.dataset.f==='open'){S.hours[i]=el.checked?[540,1140]:null}
  else if(h){const v=parseT(el.value);if(el.dataset.f==='from'&&v<h[1])h[0]=v;else if(el.dataset.f==='to'&&v>h[0])h[1]=v;else toast('טווח שעות לא תקין')}
  save();render();
});
function updateClocks(){
  const c=$('#clk');if(c)c.textContent=clockLabel();
  document.querySelectorAll('[data-exp]').forEach(n=>{n.textContent=cd(+n.dataset.exp-vnow())});
}
setInterval(()=>{if(tickExpiry()){save();render()}else updateClocks()},1000);
render();
})();
</script>
